<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-Powered Financial Risk Manager — UPI-like simulated payment protection with real-time risk assessment, escrow cooling periods, and fraud intelligence.">
    <title>RiskShield AI — Financial Risk Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Animated Background -->
        <div class="bg-pattern">
            <div class="bg-orb bg-orb-1"></div>
            <div class="bg-orb bg-orb-2"></div>
            <div class="bg-orb bg-orb-3"></div>
        </div>

        <!-- Navigation (shown when logged in) -->
        <nav id="main-nav" class="nav-bar hidden">
            <div class="nav-brand">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="13" stroke="url(#brandGrad)" stroke-width="2"/>
                        <path d="M9 14l3 3 7-7" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="brandGrad" x1="0" y1="0" x2="28" y2="28">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#22d3ee"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="brand-text">RiskShield<span class="brand-ai">AI</span></span>
            </div>
            <div class="nav-links">
                <button class="nav-link active" data-view="dashboard" id="nav-dashboard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>Dashboard</span>
                </button>
                <button class="nav-link" data-view="send-money" id="nav-send-money">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
                    <span>Send Money</span>
                </button>
                <button class="nav-link" data-view="transactions" id="nav-transactions">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                    <span>History</span>
                </button>
                <button class="nav-link" data-view="escrow" id="nav-escrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <span>Escrow</span>
                </button>
                <button class="nav-link" data-view="reports" id="nav-reports">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    <span>Reports</span>
                </button>
            </div>
            <div class="nav-user">
                <div class="nav-balance" id="nav-balance">
                    <span class="balance-label">Balance</span>
                    <span class="balance-amount" id="nav-balance-amount">₹0.00</span>
                </div>
                <button class="nav-avatar" id="nav-user-btn" title="Account">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <button class="nav-logout" id="nav-logout-btn" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Views are injected here by the SPA router -->
        </main>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Modal Container -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div id="modal-content" class="modal-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/components/risk-gauge.js"></script>
    <script src="/static/js/components/chart.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/views/login.js"></script>
    <script src="/static/js/views/dashboard.js"></script>
    <script src="/static/js/views/send-money.js"></script>
    <script src="/static/js/views/transactions.js"></script>
    <script src="/static/js/views/escrow.js"></script>
    <script src="/static/js/views/reports.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
